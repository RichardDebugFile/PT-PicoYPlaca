name: OWASP Dependency-Check (SAST / SCA)

# Analiza las dependencias del backend (Maven/Spring Boot) contra la base de
# vulnerabilidades conocidas (NVD/CVE) con el plugin oficial de OWASP.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DC_VERSION: 12.2.2
  DC_DATA: /home/runner/.dependency-check-data

jobs:
  depcheck:
    name: Analisis de dependencias (CVEs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Cachea la base NVD entre corridas: un solo download completo sirve para siempre.
      - name: Cache base NVD
        uses: actions/cache@v4
        with:
          path: ${{ env.DC_DATA }}
          key: dc-nvd-v2-${{ github.run_id }}
          restore-keys: dc-nvd-v2-

      # Reintentos SIN matar el proceso: ante un 503 del NVD, mvn termina por su
      # cuenta (sin corromper la base H2), y reintentamos tras una espera. El
      # limite del paso (90 min) solo corta un cuelgue real. Cuando el NVD da una
      # ventana limpia, el sync completa y la cache (v2) lo guarda para siempre.
      - name: Actualizar base NVD
        timeout-minutes: 90
        run: |
          for i in 1 2 3 4 5 6; do
            echo "== Intento de actualizacion NVD #$i =="
            mvn -f backend/pom.xml -B --no-transfer-progress \
              org.owasp:dependency-check-maven:${DC_VERSION}:update-only \
              -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
              -DdataDirectory=${DC_DATA} && exit 0
            echo "Intento #$i fallo (probable 503 del NVD). Esperando 120s..."
            sleep 120
          done
          echo "El NVD no dio una ventana estable tras 6 intentos"; exit 1

      # Escaneo usando la base ya descargada (sin volver a tocar el NVD).
      - name: OWASP Dependency-Check (escaneo)
        run: >-
          mvn -f backend/pom.xml -B --no-transfer-progress
          org.owasp:dependency-check-maven:${DC_VERSION}:check
          -Dformat=ALL
          -DautoUpdate=false
          -DdataDirectory=${DC_DATA}
          -DfailBuildOnCVSS=11

      - name: Subir reporte SAST (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
