name: OWASP Dependency-Check (SAST / SCA)

# Analiza las dependencias del backend (Maven/Spring Boot) contra la base de
# vulnerabilidades conocidas (NVD/CVE) con el plugin oficial de OWASP.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DC_VERSION: 12.2.2
  DC_DATA: /home/runner/.dependency-check-data

jobs:
  depcheck:
    name: Analisis de dependencias (CVEs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Cachea la base NVD entre corridas: un solo download completo sirve para siempre.
      - name: Cache base NVD
        uses: actions/cache@v4
        with:
          path: ${{ env.DC_DATA }}
          key: dc-nvd-${{ github.run_id }}
          restore-keys: dc-nvd-

      # El sync completo del NVD tarda ~15-25 min; a veces el NVD responde 503.
      # Ventana amplia por intento (25 min) para que una descarga sana COMPLETE,
      # con un reintento por si cae un 503. La cache guarda el resultado para
      # que las proximas corridas solo bajen el delta (rapidas).
      - name: Actualizar base NVD
        timeout-minutes: 55
        run: |
          for i in 1 2; do
            echo "== Intento de actualizacion NVD #$i =="
            timeout 1500 mvn -f backend/pom.xml -B --no-transfer-progress \
              org.owasp:dependency-check-maven:${DC_VERSION}:update-only \
              -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
              -DdataDirectory=${DC_DATA} && exit 0
            echo "Intento #$i fallo o expiro (limite 25 min). Esperando 120s..."
            sleep 120
          done
          echo "No se pudo actualizar la base NVD tras 2 intentos"; exit 1

      # Escaneo usando la base ya descargada (sin volver a tocar el NVD).
      - name: OWASP Dependency-Check (escaneo)
        run: >-
          mvn -f backend/pom.xml -B --no-transfer-progress
          org.owasp:dependency-check-maven:${DC_VERSION}:check
          -Dformat=ALL
          -DautoUpdate=false
          -DdataDirectory=${DC_DATA}
          -DfailBuildOnCVSS=11

      - name: Subir reporte SAST (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
