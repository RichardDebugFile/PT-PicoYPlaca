name: OWASP Dependency-Check (SAST / SCA)

# Analiza las dependencias del backend (Maven/Spring Boot) contra la base de
# vulnerabilidades conocidas (NVD/CVE) usando el plugin oficial de OWASP.
# Corre en cada push, PR y de forma manual.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  depcheck:
    name: Analisis de dependencias (CVEs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: OWASP Dependency-Check (plugin de Maven)
        run: >-
          mvn -f backend/pom.xml -B --no-transfer-progress
          org.owasp:dependency-check-maven:12.2.2:check
          -Dformat=ALL
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
          -DfailBuildOnCVSS=11

      - name: Subir reporte SAST (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
