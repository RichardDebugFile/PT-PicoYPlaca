name: OWASP Dependency-Check (SAST / SCA)

# Analiza las dependencias del proyecto (Maven + npm) contra la base de
# vulnerabilidades conocidas (NVD/CVE). Corre en cada push, PR y manualmente.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  depcheck:
    name: Analisis de dependencias (CVEs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Backend: resolver las dependencias a JARs para que DC las escanee ---
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Resolver dependencias del backend
        run: >-
          mvn -f backend/pom.xml -B --no-transfer-progress
          dependency:copy-dependencies
          -DoutputDirectory=target/dependency

      # --- Escaneo: backend (JARs) + frontend (package-lock.json) ---
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: PT-PicoYPlaca
          path: "."
          format: ALL # HTML, JSON, XML, CSV, SARIF
          out: reports
          # La NVD API key (gratis) acelera la descarga de la base de CVEs.
          # Crear en https://nvd.nist.gov/developers/request-an-api-key
          # y guardarla como secret NVD_API_KEY del repositorio.
          # Para convertir el pipeline en un "gate" agregar: --failOnCVSS 7
          args: >-
            --nvdApiKey ${{ secrets.NVD_API_KEY }}
            --enableExperimental

      - name: Subir reporte SAST (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports
