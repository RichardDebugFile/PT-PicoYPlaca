name: gitleaks (SAST - escaneo de secretos)

# Escaneo de secretos en cada push, PR y de forma manual.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necesario para escanear todo el historial de git

      - name: Instalar gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Escaneo de secretos (gitleaks)
        id: scan
        continue-on-error: true # permite subir el reporte aunque encuentre fugas
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --report-format sarif \
            --report-path gitleaks-report.sarif

      - name: Subir reporte SAST (artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-sarif
          path: gitleaks-report.sarif

      - name: Resultado del escaneo
        if: steps.scan.outcome == 'failure'
        run: |
          echo "::error::Gitleaks encontro posibles secretos. Revisa el artefacto gitleaks-report-sarif."
          exit 1
