spring.application.name=picoyplaca-backend

server.port=8080

# CORS - origen del frontend en desarrollo
cors.allowed-origins=http://localhost:4200

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# Zona horaria: Ecuador (UTC-5, sin cambio de horario de verano)
spring.jackson.time-zone=America/Guayaquil

# Logging
logging.level.com.picoyplaca=INFO
logging.level.org.springframework.web=WARN
