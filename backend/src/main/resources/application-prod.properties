spring.application.name=picoyplaca-backend

server.port=8080

# En produccion, configurar via variable de entorno:
# CORS_ALLOWED_ORIGINS=https://tu-dominio.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://frontend:80}

# Zona horaria: Ecuador (UTC-5, sin cambio de horario de verano)
spring.jackson.time-zone=America/Guayaquil

# Actuator: exponer solo health para el health check de Docker
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Deshabilitar Swagger en produccion (opcional, comentar para mantenerlo activo)
# springdoc.swagger-ui.enabled=false
# springdoc.api-docs.enabled=false

# Logging
logging.level.com.picoyplaca=WARN
logging.level.org.springframework.web=ERROR
