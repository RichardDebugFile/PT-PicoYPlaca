version: '3.9'

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: picoyplaca-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - CORS_ALLOWED_ORIGINS=http://localhost:80,http://frontend:80
      - TZ=America/Guayaquil
    networks:
      - picoyplaca-net
    mem_limit: 512m
    memswap_limit: 512m
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: picoyplaca-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - picoyplaca-net
    mem_limit: 64m
    memswap_limit: 64m

networks:
  picoyplaca-net:
    driver: bridge
